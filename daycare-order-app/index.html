<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>발주표</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root {
  --primary: #1B5E3B;
  --primary-mid: #2D7A55;
  --primary-light: #4CAF78;
  --primary-pale: #E8F5EE;
  --primary-bg: #F2FAF5;
  --fixed-color: #1565C0;
  --fixed-pale: #E3F0FF;
  --accent: #E65100;
  --accent-pale: #FFF3E0;
  --kakao: #FEE500;
  --kakao-text: #3A1D1D;
  --gray1: #F5F5F5;
  --gray2: #E0E0E0;
  --gray3: #9E9E9E;
  --gray4: #616161;
  --dark: #1A2E22;
  --white: #FFFFFF;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow: 0 4px 20px rgba(27,94,59,0.10);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--primary-bg);
  color: var(--dark);
  min-height: 100vh;
  padding-bottom: 100px;
  font-size: 15px;
}

/* ── 헤더 ── */
.header {
  background: var(--primary);
  padding: 18px 18px 0;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 3px 20px rgba(0,0,0,0.2);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.header-title { font-size: 19px; font-weight: 900; color: white; letter-spacing: -0.5px; }
.header-period {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.12);
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.2);
}

/* ── 주차 탭 ── */
.week-tabs { display: flex; }
.week-tab {
  flex: 1;
  padding: 12px 0;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  color: rgba(255,255,255,0.55);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  font-family: inherit;
  background: none;
  border-top: none; border-left: none; border-right: none;
}
.week-tab.active { color: white; border-bottom-color: #7FFFC4; }

/* ── 메인 ── */
.main { padding: 14px 14px; }

/* ── 주차 고정재료 카드 ── */
.week-fixed-card {
  background: var(--fixed-pale);
  border-radius: var(--radius-lg);
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid #BBDEFB;
  overflow: hidden;
}
.week-fixed-header {
  display: flex;
  align-items: center;
  padding: 13px 16px;
  cursor: pointer;
  gap: 8px;
  user-select: none;
}
.week-fixed-title {
  flex: 1;
  font-size: 14px;
  font-weight: 800;
  color: var(--fixed-color);
}
.week-fixed-period {
  font-size: 11px;
  color: var(--fixed-color);
  opacity: 0.6;
  font-weight: 500;
}
.week-fixed-arrow {
  font-size: 11px;
  color: var(--fixed-color);
  opacity: 0.6;
  transition: transform 0.2s;
}
.week-fixed-card.open .week-fixed-arrow { transform: rotate(180deg); }
.week-fixed-body {
  display: none;
  padding: 4px 12px 12px;
  border-top: 1px solid #BBDEFB;
}
.week-fixed-card.open .week-fixed-body { display: block; }

/* ── 식단 카드 ── */
.week-meal-card {
  background: #FFF8E1;
  border-radius: var(--radius-lg);
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid #FFE082;
  overflow: hidden;
}
.week-meal-header {
  display: flex;
  align-items: center;
  padding: 13px 16px;
  cursor: pointer;
  gap: 8px;
  user-select: none;
}
.week-meal-title { flex: 1; font-size: 14px; font-weight: 800; color: #E65100; }
.week-meal-arrow { font-size: 11px; color: #E65100; opacity: 0.6; transition: transform 0.2s; }
.week-meal-card.open .week-meal-arrow { transform: rotate(180deg); }
.week-meal-body { display: none; padding: 4px 12px 12px; border-top: 1px solid #FFE082; }
.week-meal-card.open .week-meal-body { display: block; }
.meal-plan-row {
  display: flex;
  align-items: flex-start;
  padding: 8px 4px;
  border-bottom: 1px solid #FFE082;
  gap: 10px;
}
.meal-plan-row:last-child { border-bottom: none; }
.meal-plan-dow { font-size: 14px; font-weight: 800; color: #E65100; width: 20px; flex-shrink: 0; padding-top: 3px; }
.meal-plan-menu {
  flex: 1;
  font-size: 13px;
  color: var(--dark);
  line-height: 1.5;
  min-height: 24px;
  outline: none;
  border-radius: 6px;
  padding: 2px 6px;
  cursor: text;
  word-break: keep-all;
  min-width: 0;
}
.meal-plan-menu:empty::before { content: attr(placeholder); color: var(--gray3); }
.meal-plan-menu:focus { background: white; box-shadow: 0 0 0 2px #FFD54F; border-radius: 6px; }

/* ── 날짜 카드 ── */
.day-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: box-shadow 0.2s;
}
.day-card.has-items { box-shadow: var(--shadow); }
.day-header {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  cursor: pointer;
  gap: 10px;
  user-select: none;
}
.day-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--gray2);
  flex-shrink: 0;
  transition: background 0.2s;
}
.day-card.has-items .day-dot { background: var(--primary-light); }
.day-label { flex: 1; }
.day-date { font-size: 16px; font-weight: 700; color: var(--dark); }
.day-date .dow { font-size: 13px; font-weight: 500; color: var(--gray3); margin-left: 6px; }
.day-date .dow.sat { color: #1565C0; }
.day-date .dow.sun { color: #C62828; }
.day-count {
  font-size: 12px;
  color: var(--primary-mid);
  font-weight: 700;
  background: var(--primary-pale);
  padding: 3px 10px;
  border-radius: 12px;
  display: none;
}
.day-card.has-items .day-count { display: block; }
.day-arrow { color: var(--gray3); font-size: 12px; transition: transform 0.2s; }
.day-card.open .day-arrow { transform: rotate(180deg); }

/* ── 품목 영역 ── */
.day-body { display: none; padding: 0 12px 12px; }
.day-card.open .day-body { display: block; }

/* 품목 행 */
.item-row {
  display: flex;
  align-items: center;
  padding: 8px 6px;
  border-radius: var(--radius-sm);
  gap: 10px;
  transition: background 0.15s;
  margin-bottom: 2px;
}
.item-row.checked { background: var(--primary-pale); }
.item-row.fixed-item.checked { background: var(--fixed-pale); }
.item-check {
  width: 26px; height: 26px;
  border: 2px solid var(--gray2);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  font-size: 14px;
  transition: all 0.15s;
  color: transparent;
}
.item-row.checked .item-check { background: var(--primary-light); border-color: var(--primary-light); color: white; }
.item-row.fixed-item.checked .item-check { background: var(--fixed-color); border-color: var(--fixed-color); }
.item-name { flex: 1; font-size: 15px; font-weight: 500; }
.item-row.fixed-item .item-name { color: var(--fixed-color); font-weight: 600; }
.item-row:not(.checked) .item-name { color: var(--gray4); }
.item-row.checked .item-name { color: var(--dark); }

/* 수량 컨트롤 */
.qty-wrap { display: flex; align-items: center; transition: opacity 0.2s; }
.item-row:not(.checked) .qty-wrap { opacity: 0.3; pointer-events: none; }
.qty-btn {
  width: 30px; height: 30px;
  background: var(--gray1);
  border: none;
  font-size: 18px; font-weight: 700;
  color: var(--primary);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px 0 0 8px;
  font-family: inherit;
  transition: background 0.1s;
  line-height: 1;
}
.qty-btn:last-child { border-radius: 0 8px 8px 0; }
.qty-btn:active { background: var(--primary-pale); }
.qty-input {
  width: 44px; height: 30px;
  border: 1px solid var(--gray2);
  border-left: none; border-right: none;
  text-align: center;
  font-size: 15px; font-weight: 700;
  font-family: inherit;
  color: var(--primary);
  background: white;
  outline: none;
}
.qty-input::-webkit-inner-spin-button,
.qty-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.item-unit { font-size: 12px; color: var(--gray3); width: 22px; text-align: left; }

/* 직접 입력 */
.custom-input-row {
  display: flex;
  gap: 6px;
  padding-top: 10px;
  border-top: 1.5px dashed var(--gray2);
  align-items: center;
}
.custom-name-input {
  flex: 1;
  padding: 9px 12px;
  border: 1.5px solid var(--gray2);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  color: var(--dark);
  outline: none;
  background: white;
  min-width: 0;
}
.custom-name-input:focus { border-color: var(--primary-light); }
.custom-name-input::placeholder { color: var(--gray3); }
.custom-unit-select {
  width: 58px;
  padding: 9px 4px;
  border: 1.5px solid var(--gray2);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 13px;
  color: var(--dark);
  outline: none;
  background: white;
  text-align: center;
  flex-shrink: 0;
}
.custom-add-btn {
  padding: 9px 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
}
.custom-add-btn:active { filter: brightness(0.9); }

/* ── 하단 바 ── */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: white;
  padding: 10px 14px 28px;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.10);
  display: flex;
  gap: 10px;
  z-index: 100;
}
.btn-reset {
  background: var(--gray1);
  color: var(--gray4);
  border: none;
  border-radius: var(--radius-md);
  padding: 14px 16px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
}
.btn-kakao {
  flex: 1;
  background: var(--kakao);
  color: var(--kakao-text);
  border: none;
  border-radius: var(--radius-md);
  padding: 14px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: filter 0.15s;
}
.btn-kakao:active { filter: brightness(0.93); }
.btn-kakao .badge {
  background: var(--kakao-text);
  color: var(--kakao);
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 10px;
}

/* ── 모달 ── */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: white;
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 0 0 40px;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.modal-handle { width: 40px; height: 4px; background: var(--gray2); border-radius: 2px; margin: 14px auto 0; }
.modal-header { padding: 16px 20px 10px; display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 17px; font-weight: 900; color: var(--dark); }
.modal-close {
  width: 30px; height: 30px;
  background: var(--gray1);
  border: none; border-radius: 50%;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--gray4);
}

/* 미리보기 */
.preview-body { padding: 0 18px; }
.preview-week-title {
  font-size: 13px; font-weight: 700; color: var(--primary);
  background: var(--primary-pale); padding: 7px 12px;
  border-radius: var(--radius-sm); margin: 10px 0 8px;
}
.preview-day { margin-bottom: 12px; border: 1px solid var(--gray2); border-radius: var(--radius-sm); overflow: hidden; }
.preview-day-header { background: var(--gray1); padding: 7px 12px; font-size: 13px; font-weight: 700; color: var(--dark); }
.preview-item { display: flex; justify-content: space-between; padding: 7px 12px; font-size: 14px; border-top: 1px solid var(--gray2); }
.preview-item .pname { color: var(--dark); }
.preview-item .pqty { font-weight: 700; color: var(--primary); }
.preview-item.fixed-item .pname { color: var(--fixed-color); }
.preview-item.fixed-item .pqty { color: var(--fixed-color); }
.preview-empty { text-align: center; padding: 30px; color: var(--gray3); font-size: 14px; }
.modal-send-btn {
  margin: 16px 18px 0;
  width: calc(100% - 36px);
  background: var(--kakao); color: var(--kakao-text);
  border: none; border-radius: var(--radius-md);
  padding: 15px; font-family: inherit; font-size: 16px; font-weight: 900; cursor: pointer;
}
.modal-copy-btn {
  margin: 10px 18px 0;
  width: calc(100% - 36px);
  background: var(--primary-pale); color: var(--primary);
  border: none; border-radius: var(--radius-md);
  padding: 13px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
}

/* 날짜 모달 */
.date-modal { padding: 20px 20px 0; }
.date-modal label { display: block; font-size: 13px; font-weight: 700; color: var(--gray4); margin-bottom: 6px; }
.date-modal input[type=date] {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--gray2); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 16px; color: var(--dark);
  outline: none; background: white; margin-bottom: 16px;
}
.date-modal input[type=date]:focus { border-color: var(--primary-light); }
.date-confirm-btn {
  width: 100%; background: var(--primary); color: white;
  border: none; border-radius: var(--radius-md);
  padding: 15px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 4px;
}

/* ── 삭제 버튼 ── */
.item-delete {
  width: 24px; height: 24px;
  background: none;
  border: none;
  color: var(--gray3);
  font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border-radius: 50%;
  transition: all 0.15s;
  padding: 0;
}
.item-delete:active { background: #FFE0E0; color: #C62828; }

/* ── 식단 카드 내 날짜별 아이템 ── */
.meal-day-item {
  border-bottom: 1px solid #FFE082;
}
.meal-day-item:last-child { border-bottom: none; }
.meal-day-header {
  display: flex;
  align-items: center;
  padding: 8px 4px;
  gap: 8px;
  cursor: default;
}
.meal-day-meta {
  font-size: 13px;
  font-weight: 800;
  color: #E65100;
  white-space: nowrap;
  flex-shrink: 0;
}
.meal-day-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  cursor: pointer;
  flex-shrink: 0;
  color: #E65100;
  font-size: 11px;
  opacity: 0.6;
  transition: transform 0.2s;
  border-radius: 50%;
  border: none;
  background: none;
}
.meal-day-item.open .meal-day-toggle { transform: rotate(180deg); }
.meal-day-body {
  display: none;
  padding: 0 4px 10px;
}
.meal-day-item.open .meal-day-body { display: block; }

/* ── 식단표 분석 카드 ── */
.analyze-card {
  background: linear-gradient(135deg, #EDE7F6, #E8F5EE);
  border-radius: var(--radius-lg);
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid #B39DDB;
  overflow: hidden;
}
.analyze-header {
  display: flex; align-items: center;
  padding: 13px 16px; gap: 8px; cursor: pointer; user-select: none;
}
.analyze-title { flex: 1; font-size: 14px; font-weight: 800; color: #4527A0; }
.analyze-arrow { font-size: 11px; color: #4527A0; opacity: 0.6; transition: transform 0.2s; }
.analyze-card.open .analyze-arrow { transform: rotate(180deg); }
.analyze-body { display: none; padding: 12px 16px 16px; border-top: 1px solid #B39DDB; }
.analyze-card.open .analyze-body { display: block; }
.analyze-upload-btn {
  width: 100%;
  background: #4527A0; color: white;
  border: none; border-radius: var(--radius-sm);
  padding: 13px; font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.analyze-upload-btn:active { filter: brightness(0.88); }
.analyze-loading { text-align: center; padding: 14px 0 4px; color: #4527A0; font-size: 13px; font-weight: 500; }
.analyze-status { font-size: 12px; color: var(--gray4); padding: 8px 2px 0; line-height: 1.5; }
.analyze-hint { font-size: 11px; color: var(--gray3); margin-top: 8px; line-height: 1.5; }

/* ── 토스트 ── */
.toast {
  position: fixed;
  bottom: 96px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--dark); color: white;
  font-size: 14px; font-weight: 500;
  padding: 10px 22px; border-radius: 22px;
  opacity: 0; transition: all 0.2s;
  pointer-events: none; white-space: nowrap; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 뷰 모드 (원장님용 공유 페이지) ── */
.view-overlay {
  position: fixed;
  inset: 0;
  background: var(--primary-bg);
  z-index: 9999;
  overflow-y: auto;
  padding-bottom: 60px;
}
.view-header {
  background: var(--primary);
  padding: 28px 20px 22px;
  color: white;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 3px 16px rgba(0,0,0,0.2);
}
.view-header h1 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
.view-period { font-size: 13px; opacity: 0.75; margin-bottom: 14px; }
.view-print-btn {
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.35);
  color: white;
  border-radius: 20px;
  padding: 8px 18px;
  font-family: inherit;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
}
.view-body { padding: 16px; }
.view-week-block { margin-bottom: 24px; }
.view-week-title {
  font-size: 15px; font-weight: 800; color: var(--primary);
  background: var(--primary-pale);
  padding: 9px 14px; border-radius: var(--radius-sm);
  margin-bottom: 12px;
}
.view-card {
  background: white;
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.view-card-header {
  padding: 10px 14px;
  font-size: 13px; font-weight: 700;
}
.view-card-header.fixed { background: var(--fixed-pale); color: var(--fixed-color); }
.view-card-header.day { background: var(--gray1); color: var(--dark); }
.view-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 14px;
  font-size: 14px;
  border-top: 1px solid var(--gray1);
}
.view-item-name { color: var(--dark); font-weight: 500; }
.view-item-qty { font-weight: 800; color: var(--primary); }
.view-fixed .view-item-name { color: var(--fixed-color); }
.view-fixed .view-item-qty { color: var(--fixed-color); }
.view-empty { text-align: center; padding: 60px 20px; color: var(--gray3); font-size: 14px; }

@media print {
  .view-print-btn { display: none; }
  .view-header { position: static; }
  body { background: white; }
}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div class="header-top">
    <div class="header-title">🥬 식단 발주표</div>
    <div class="header-period" id="period-btn" onclick="openDateModal()">기간 설정 ▾</div>
  </div>
  <div class="week-tabs">
    <button class="week-tab active" onclick="switchWeek(1, this)">1주차</button>

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return {
    full: `${d.getMonth()+1}월 ${d.getDate()}일`,
    dow: WEEKDAYS[d.getDay()],
    dayOfWeek: d.getDay(),
  };
}
function getWeekDates(week) {
  const start = startDates[week];
  if (!start) return [];
  return Array.from({ length: 5 }, (_, i) => addDays(start, i));
}

  const w2 = addDays(w1, 7);

function resizeImageToBase64(file, maxWidth = 1600) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxWidth) { height = Math.round(height * maxWidth / width); width = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve({ base64: canvas.toDataURL('image/jpeg', 0.96).split(',')[1], mediaType: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

        const response = await fetch('/api/analyze-menu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: base64, mediaType, year, month }),
    });
    if (!response.ok) {
      const errBody = await response.json().catch(() => ({}));
      throw new Error('API 오류 ' + response.status + ': ' + (errBody?.error || ''));
    }
    const result = await response.json();
    const applied = applyAnalysisResult(result);
    statusEl.innerHTML = `<div class="analyze-status">✅ ${result.days.length}일 분석 완료 · ${applied}일 적용됨</div>`;
    showToast('식단 분석 완료! 날짜를 열어 재료를 확인하세요');
  } catch (e) {
    statusEl.innerHTML = `<div class="analyze-status" style="color:#C62828">❌ 분석 실패: ${e.message}</div>`;
    console.error(e);
  }
  event.target.value = '';
}

function applyAnalysisResult(result) {
  if (!result.days) return 0;
  const validDates = new Set([...getWeekDates(1), ...getWeekDates(2)]);
  let applied = 0;
  result.days.forEach(day => {
    if (!validDates.has(day.date)) return;
    applied++;
    const data = getOrInitDay(day.date);
    data.menu = Array.isArray(day.menu) ? day.menu.map(m => typeof m === 'string' ? m : String(m)) : (day.menu ? String(day.menu).split(',').map(s => s.trim()) : []);
    (day.ingredients || []).forEach(name => {
      if (!data.extra.some(e => e.name === name)) {
        data.extra.push({ name, unit: UNIT_MAP[name] || '개', qty: 1, checked: true });
      }
    });
  });
  render();
  return applied;
}
function addCustomItem(dateStr) {
  const nameEl = document.getElementById(`cname-${dateStr}`);
  const unitEl = document.getElementById(`cunit-${dateStr}`);
  const name = nameEl.value.trim();
  if (!name) { showToast('재료 이름을 입력해주세요'); nameEl.focus(); return; }
  const data = getOrInitDay(dateStr);
  if (data.extra.some(e => e.name === name)) { showToast('이미 추가된 재료예요'); return; }
  data.extra.push({ name, unit: unitEl.value, qty: 1, checked: true });
  nameEl.value = '';
  refreshDayCard(dateStr);
  showToast(`'${name}' 추가됐어요`);
}

function refreshDayCard(dateStr) {
  const data = getOrInitDay(dateStr);
  const body = document.getElementById(`mdbody-${dateStr}`);
  if (body) body.innerHTML = buildDayBody(dateStr, data);
  updateBadge();
}

function updateBadge() {
  let total = 0;
  [1, 2].forEach(w => {
    const fixed = weekFixed[w];
    if (fixed) total += fixed.filter(i => i.checked).length;
    getWeekDates(w).forEach(d => {
      const data = dayData[d];
      if (data) total += data.extra.filter(i => i.checked).length;
    });
  });
  document.getElementById('total-badge').textContent = total;
}

// ── 미리보기 ───────────────────────────────────────────
function openPreview() {
  const body = document.getElementById('preview-body');
  body.innerHTML = '';
  let hasAny = false;
  [1, 2].forEach(w => {
    let weekHtml = '';
    const fixed = weekFixed[w];
    const fixedItems = fixed ? fixed.filter(i => i.checked) : [];
    if (fixedItems.length > 0) {
      hasAny = true;
      weekHtml += `<div class="preview-day">
        <div class="preview-day-header">📌 고정 재료</div>
        ${fixedItems.map(i => `<div class="preview-item fixed-item">
          <span class="pname">${i.name}</span>
          <span class="pqty">${i.qty}${i.unit}</span>
        </div>`).join('')}
      </div>`;
    }
    getWeekDates(w).forEach(dateStr => {
      const data = dayData[dateStr];
      if (!data) return;
      const items = data.extra.filter(i => i.checked);
      if (items.length === 0) return;
      hasAny = true;
      const { full, dow } = formatDate(dateStr);
      weekHtml += `<div class="preview-day">
        <div class="preview-day-header">📅 ${full} (${dow})</div>
        ${items.map(i => `<div class="preview-item">
          <span class="pname">${i.name}</span>
          <span class="pqty">${i.qty}${i.unit}</span>
        </div>`).join('')}
      </div>`;
    });
    if (weekHtml) body.innerHTML += `<div class="preview-week-title">${w}주차</div>${weekHtml}`;
  });
  if (!hasAny) {
    body.innerHTML = `<div class="preview-empty">아직 선택된 품목이 없어요.<br>날짜를 열어서 재료를 확인해주세요.</div>`;
  }
  document.getElementById('preview-modal').classList.add('open');
}
function closePreview(e) {
  if (e.target.id === 'preview-modal') document.getElementById('preview-modal').classList.remove('open');
}
function closePreviewBtn() {
  document.getElementById('preview-modal').classList.remove('open');
}

// ── 텍스트 생성 ────────────────────────────────────────
function buildText() {
  const s1 = startDates[1];
  if (!s1) return '';
  const end = addDays(startDates[2] || addDays(s1, 7), 4);
  let text = `[식단 발주표]\n${formatDate(s1).full} ~ ${formatDate(end).full}\n${'─'.repeat(20)}\n`;
  [1, 2].forEach(w => {
    const fixed = weekFixed[w];
    const fixedItems = fixed ? fixed.filter(i => i.checked) : [];
    const dates = getWeekDates(w);
    const hasExtra = dates.some(d => { const dd = dayData[d]; return dd && dd.extra.some(i => i.checked); });
    if (fixedItems.length === 0 && !hasExtra) return;
    text += `\n▶ ${w}주차\n`;
    if (fixedItems.length > 0) {
      text += `\n📌 고정 재료\n`;
      fixedItems.forEach(i => { text += `  · ${i.name} ${i.qty}${i.unit}\n`; });
    }
    dates.forEach(dateStr => {
      const data = dayData[dateStr];
      if (!data) return;
      const extras = data.extra.filter(i => i.checked);
      if (extras.length === 0) return;
      const { full, dow } = formatDate(dateStr);
      text += `\n📅 ${full}(${dow})\n`;
      extras.forEach(i => { text += `  · ${i.name} ${i.qty}${i.unit}\n`; });
    });
  });
  text += `\n${'─'.repeat(20)}\n이상입니다.`;
  return text;
}

// ── 공유 URL (원장님용 뷰) ─────────────────────────────
// 체크된 항목만, 단축 키(n/u/q)로 인코딩해 URL 크기를 최소화 (모바일 10K 제한 대응)
function buildViewUrl() {
  const cmpr = (items) => (items || []).filter(i => i.checked).map(i => `${i.name}|${i.unit}|${i.qty}`);
  const vwf = {}, vdd = {};
  [1, 2].forEach(w => {
    const f = cmpr(weekFixed[w]);
    if (f.length) vwf[w] = f;
  });
  Object.entries(dayData).forEach(([date, data]) => {
    const e = cmpr(data.extra);
    if (e.length) vdd[date] = e;
  });
  const payload = { sd: startDates, wf: vwf, dd: vdd };
  const json = JSON.stringify(payload);
  const compressed = (typeof LZString !== 'undefined')
    ? LZString.compressToEncodedURIComponent(json)
    : btoa(unescape(encodeURIComponent(json)));
  return `${APP_URL}?v=${compressed}`;
}

// ── 카카오톡 전송 ──────────────────────────────────────
function sendKakao() {
  const hasContent = [1,2].some(w => {
    const f = weekFixed[w];
    if (f && f.some(i => i.checked)) return true;
    return getWeekDates(w).some(d => { const dd = dayData[d]; return dd && dd.extra.some(i => i.checked); });
  });
  if (!hasContent) { showToast('입력된 품목이 없어요'); return; }

  if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
    const text = buildText();
    const preview = text.length > 200 ? text.substring(0, 197) + '...' : text;
    const viewUrl = buildViewUrl();
    try {
      Kakao.Share.sendDefault({
        objectType: 'text',
        text: preview,
        link: { mobileWebUrl: viewUrl, webUrl: APP_URL },
        buttonTitle: '📋 발주표 전체 보기',
      });
      closePreviewBtn();
    } catch(e) {
      console.warn('Kakao Share 실패, 폴백으로 전환:', e);
      fallbackSend();
    }
  } else {
    fallbackSend();
  }
}

function fallbackSend() {
  const text = buildText();
  const copy = () => {
    showToast('📋 복사됨! 카카오톡 열어서 붙여넣기하세요');
    closePreviewBtn();
    if (/iPhone|iPad|Android/i.test(navigator.userAgent))
      setTimeout(() => { window.location.href = 'kakaotalk://'; }, 800);
  };
  navigator.clipboard.writeText(text).then(copy).catch(() => { fallbackCopy(text); copy(); });
}

function copyText() {
  const text = buildText();
  navigator.clipboard.writeText(text)
    .then(() => showToast('📋 복사 완료! 카톡에 붙여넣기하세요'))
    .catch(() => fallbackCopy(text));
}
function fallbackCopy(text) {
  const el = document.createElement('textarea');
  el.value = text;
  el.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(el);
  el.focus(); el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
  showToast('📋 복사 완료!');
}

// ── 뷰 모드 (원장님이 링크 열었을 때) ────────────────────
function checkViewMode() {
  const param = new URLSearchParams(window.location.search).get('v');
  if (!param) return false;
  try {
    let json;
    // LZString 압축 시도, 실패 시 구버전 base64로 폴백
    if (typeof LZString !== 'undefined') {
      json = LZString.decompressFromEncodedURIComponent(param);
    }
    if (!json) json = decodeURIComponent(escape(atob(param)));
    const data = JSON.parse(json);
    renderViewMode(data);
    return true;
  } catch(e) {
    return false;
  }
}

function renderViewMode(data) {
  const sd = data.sd || {};
  const wf = data.wf || {};
  const dd = data.dd || {};

  const getWeekDatesFromSD = (w) => {
    const start = sd[w];
    if (!start) return [];
    return Array.from({ length: 5 }, (_, i) => addDays(start, i));
  };
  const formatD = (s) => {
    const d = new Date(s + 'T00:00:00');
    return { full: `${d.getMonth()+1}월 ${d.getDate()}일`, dow: WEEKDAYS[d.getDay()] };
  };

  let periodStr = '';
  if (sd[1] && sd[2]) {
    const f1 = formatD(sd[1]);
    const f2 = formatD(addDays(sd[2], 4));
    periodStr = `${f1.full} ~ ${f2.full}`;
  }

  const pi = (s) => { const p = typeof s === 'string' ? s.split('|') : [s.n||s.name, s.u||s.unit, s.q||s.qty]; return {n: p[0], u: p[1], q: p[2]}; };

  let weeksHtml = '';
  [1, 2].forEach(w => {
    const fixedItems = (wf[w] || []).map(pi);
    const dates = getWeekDatesFromSD(w);
    const dayBlocks = dates.map(dateStr => {
      const extras = (dd[dateStr] || []).map(pi);
      if (extras.length === 0) return '';
      const { full, dow } = formatD(dateStr);
      return `<div class="view-card">
        <div class="view-card-header day">📅 ${full} (${dow})</div>
        ${extras.map(i => `<div class="view-item">
          <span class="view-item-name">${i.n}</span>
          <span class="view-item-qty">${i.q}${i.u}</span>
        </div>`).join('')}
      </div>`;
    }).join('');

    if (fixedItems.length === 0 && !dayBlocks) return;
    weeksHtml += `<div class="view-week-block">
      <div class="view-week-title">${w}주차</div>
      ${fixedItems.length > 0 ? `<div class="view-card view-fixed">
        <div class="view-card-header fixed">📌 고정 재료</div>
        ${fixedItems.map(i => `<div class="view-item">
          <span class="view-item-name">${i.n}</span>
          <span class="view-item-qty">${i.q}${i.u}</span>
        </div>`).join('')}
      </div>` : ''}
      ${dayBlocks}
    </div>`;
  });

  if (!weeksHtml) weeksHtml = `<div class="view-empty">발주 내용이 없습니다.</div>`;

  const overlay = document.createElement('div');
  overlay.className = 'view-overlay';
  overlay.innerHTML = `
    <div class="view-header">
      <h1>📋 식단 발주표</h1>
      <div class="view-period">${periodStr}</div>
      <button class="view-print-btn" onclick="window.print()">🖨️ 인쇄하기</button>
    </div>
    <div class="view-body">${weeksHtml}</div>
  `;
  document.body.appendChild(overlay);
}

// ── 날짜 모달 ──────────────────────────────────────────
function openDateModal() { document.getElementById('date-modal').classList.add('open'); }
function closeDateModal(e) {
  if (e.target.id === 'date-modal') document.getElementById('date-modal').classList.remove('open');
}

// ── 탭 전환 ───────────────────────────────────────────
function switchWeek(week, btn) {
  currentWeek = week;
  document.querySelectorAll('.week-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── 초기화 ────────────────────────────────────────────
function confirmReset() {
  if (!confirm('이번 주차 입력 내용을 초기화할까요?')) return;
  delete weekFixed[currentWeek];
  getWeekDates(currentWeek).forEach(d => { delete dayData[d]; });
  render();
  showToast('초기화 완료');
}

// ── 토스트 ────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── 시작 ──────────────────────────────────────────────
if (!checkViewMode()) {
  initDefaultDates();
  render();
  initKakao();
}
</script>
